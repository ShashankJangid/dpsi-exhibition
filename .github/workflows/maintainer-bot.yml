# .github/workflows/maintainer-bot.yml
# Automated Pull Request Review Engine powered by maintainer-bot & 0G Private Computer

name: maintainer-bot
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review (empty = review every open PR, oldest first)
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: >-
    maintainer-bot-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'backfill' }}-${{
    (github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/bot review'))
    && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
       !startsWith(github.event.pull_request.head.ref, 'bot/')) ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/bot review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 300 || 30 }}
    steps:
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .maintainer-bot
          key: maintainer-bot-ledger-${{ steps.day.outputs.day }}-${{ github.run_id }}
          restore-keys: maintainer-bot-ledger-${{ steps.day.outputs.day }}-

      - name: Verify OG_PC_API_KEY Secret
        id: check_key
        env:
          OG_KEY: ${{ secrets.OG_PC_API_KEY }}
        run: |
          if [ -z "$OG_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OG_PC_API_KEY secret is not configured in repository settings. Skipping maintainer-bot review gracefully."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run maintainer-bot review
        if: steps.check_key.outputs.has_key == 'true'
        uses: Gathin23/maintainer-bot@4beda3b5778990b44207511dc89155f26073209c # pinned commit of Gathin23/maintainer-bot
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          og-pc-api-key: ${{ secrets.OG_PC_API_KEY }}
          pr: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          force: ${{ github.event_name == 'issue_comment' }}
          daily-cap-usd: "5"
